name: Build & push base image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-push.yml
  workflow_dispatch: {}

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: runpod-blackwell-base

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image ref (GHCR requires lowercase)
        id: ref
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.ref.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.ref.outputs.owner }}/${{ env.IMAGE_NAME }}:sha-${{ steps.ref.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optionnel : déclenche automatiquement un rebuild de runpod-comfy-blackwell
      # quand la base change, plutôt que d'attendre son prochain push.
      # Prérequis :
      #   1. Créer un PAT (scope "repo") avec accès au dépôt runpod-comfy-blackwell.
      #   2. L'ajouter comme secret BASE_IMAGE_DISPATCH_TOKEN dans CE dépôt (base).
      #   3. Adapter "repository:" ci-dessous au nom réel du dépôt GitHub de ComfyUI.
      #   4. Décommenter le step.
      # - name: Notifier runpod-comfy-blackwell
      #   uses: peter-evans/repository-dispatch@v3
      #   with:
      #     token: ${{ secrets.BASE_IMAGE_DISPATCH_TOKEN }}
      #     repository: ${{ steps.ref.outputs.owner }}/runpod-comfy-blackwell
      #     event-type: base-image-updated
